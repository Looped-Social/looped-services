# Production Environment Configuration

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Logging Configuration (Production-safe)
logging.level.com.looped.services=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.file.name=${LOG_FILE_PATH:/var/log/looped/application.log}
logging.file.max-size=100MB
logging.file.max-history=30

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# AWS Configuration
aws.region=${AWS_REGION}
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID}
aws.cognito.client-id=${COGNITO_CLIENT_ID}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# CORS Configuration (Restricted)
cors.allowed-origins=${ALLOWED_ORIGINS}
cors.allowed-methods=GET,POST,PUT,DELETE
cors.allowed-headers=Authorization,Content-Type,X-Requested-With
cors.allow-credentials=false

# WebSocket Configuration
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}
websocket.message-size-limit=32768

# Actuator Configuration (Restricted)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.security.enabled=true

# Rate Limiting
rate-limit.enabled=true
rate-limit.requests-per-minute=${RATE_LIMIT_RPM:30}
rate-limit.burst-capacity=${RATE_LIMIT_BURST:10}

# Content Moderation
moderation.auto-flag-enabled=true
moderation.strict-mode=true
moderation.auto-flag-threshold=0.6

# Cache Configuration
spring.cache.type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000ms}

# SSL Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}

# Performance Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Async Configuration
spring.task.execution.pool.core-size=${ASYNC_CORE_POOL_SIZE:10}
spring.task.execution.pool.max-size=${ASYNC_MAX_POOL_SIZE:50}
spring.task.execution.pool.queue-capacity=${ASYNC_QUEUE_CAPACITY:1000}

# Monitoring
management.metrics.export.prometheus.enabled=${PROMETHEUS_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}

# External Service URLs
external.linkedin-api.url=${LINKEDIN_API_URL:https://api.linkedin.com}
external.email-service.url=${EMAIL_SERVICE_URL:}
external.moderation-service.url=${MODERATION_SERVICE_URL:}

# Backup Configuration
backup.enabled=${BACKUP_ENABLED:true}
backup.schedule=${BACKUP_SCHEDULE:0 2 * * *}
backup.retention-days=${BACKUP_RETENTION:30}

# Maintenance Mode
maintenance.enabled=${MAINTENANCE_MODE:false}
maintenance.message=${MAINTENANCE_MESSAGE:Service temporarily unavailable}

# Content Security
content.max-size=${CONTENT_MAX_SIZE:1000}
content.scan-enabled=${CONTENT_SCAN:true}
content.profanity-filter=${PROFANITY_FILTER:true}

# Privacy Settings
privacy.log-retention-days=${LOG_RETENTION:90}
privacy.anonymize-old-data=${ANONYMIZE_DATA:true}
privacy.gdpr-compliance=${GDPR_COMPLIANCE:true}