# Development Environment Configuration

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/looped_dev
spring.datasource.username=${DB_USERNAME:looped_dev}
spring.datasource.password=${DB_PASSWORD:dev_password}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.com.looped.services=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration (Relaxed for development)
spring.security.user.password=dev123

# CORS Configuration (Relaxed for development)
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# WebSocket Configuration
websocket.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Actuator Configuration (More endpoints exposed in dev)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Mock External Services
mock.aws-cognito=true
mock.linkedin-api=true
mock.email-service=true

# Rate Limiting (Disabled in dev)
rate-limit.enabled=false

# Debug Features
debug.log-requests=true
debug.log-responses=true
debug.mock-data=true

# Content Validation (Relaxed in dev)
validation.strict-mode=false
moderation.auto-flag-threshold=0.8

# Performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.generate_statistics=true

# Development Data
dev.create-sample-data=true
dev.sample-users=10
dev.sample-companies=5
dev.sample-posts=50