# Test Environment Configuration

# Database Configuration (H2 in-memory for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging tests)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration (Minimal for tests)
logging.level.com.looped.services=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.test=INFO

# Security Configuration (Relaxed for tests)
spring.security.user.password=test123

# Mock External Services
mock.aws-cognito=true
mock.linkedin-api=true
mock.email-service=true

# WebSocket Configuration (Disabled for most tests)
websocket.enabled=false

# Rate Limiting (Disabled for tests)
rate-limit.enabled=false

# Async Configuration (Synchronous for tests)
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1

# Cache Configuration (Simple for tests)
spring.cache.type=simple

# Test Data
test.create-sample-data=false
test.cleanup-after-test=true

# Content Validation (Relaxed for tests)
validation.strict-mode=false
moderation.auto-flag-enabled=false

# Performance (Optimized for tests)
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.generate_statistics=false