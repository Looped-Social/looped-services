spring:
  application:
    name: looped-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/looped}
    username: ${DB_USERNAME:looped}
    password: ${DB_PASSWORD:looped}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  data:
    redis:
      url: ${redis.url}

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
  pattern:
    console: ''

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

s3:
  bucket: ${S3_BUCKET:looped-dev-media}
  region: ${AWS_REGION:us-east-1}
  verification:
    bucket: ${S3_VERIFICATION_BUCKET:}
    region: ${S3_VERIFICATION_REGION:${AWS_REGION:us-east-1}}
  messaging:
    bucket: ${S3_MESSAGING_BUCKET:${S3_DM_BUCKET:}}
    region: ${S3_MESSAGING_REGION:${S3_DM_REGION:${AWS_REGION:us-east-1}}}

cloudfront:
  domain: ${CLOUDFRONT_DOMAIN:}

logoDev:
  token: ${LOGO_DEV_TOKEN:}
  retina: ${LOGO_DEV_RETINA:true}

media:
  # Prefer the human-readable *_SIZE env vars (e.g., "20MB", "256MB"); *_BYTES are supported for backward compatibility.
  maxImageSize: ${MEDIA_MAX_IMAGE_SIZE:${MEDIA_MAX_IMAGE_BYTES:10MB}}
  maxVideoSize: ${MEDIA_MAX_VIDEO_SIZE:${MEDIA_MAX_VIDEO_BYTES:100MB}}
  callbackSecret: ${MEDIA_CALLBACK_SECRET:}

auth:
  # Firebase Auth defaults; override via env in each environment
  issuer: ${AUTH_ISSUER:https://securetoken.google.com/YOUR_FIREBASE_PROJECT_ID}
  audience: ${AUTH_AUDIENCE:YOUR_FIREBASE_PROJECT_ID}
  jwksUri: ${AUTH_JWKS_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}

firebase:
  admin:
    credentialsJson: ${FIREBASE_ADMIN_CREDENTIALS_JSON:}
    credentialsPath: ${FIREBASE_ADMIN_CREDENTIALS_PATH:}
    required: ${FIREBASE_ADMIN_REQUIRED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Idempotency-Key,X-Actor,X-Media-Signature}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

admin:
  edge-secret: ${ADMIN_EDGE_SECRET:}

redis:
  url: ${REDIS_URL:redis://localhost:6379}

sqs:
  notifQueueUrl: ${SQS_NOTIF_QUEUE_URL:}
  region: ${AWS_REGION:us-east-1}

notifications:
  celebrations:
    enabled: ${NOTIFICATIONS_CELEBRATIONS_ENABLED:true}
    birthday-enabled: ${NOTIFICATIONS_BIRTHDAY_ENABLED:true}
    anniversary-enabled: ${NOTIFICATIONS_ANNIVERSARY_ENABLED:true}
    batch-size: ${NOTIFICATIONS_CELEBRATIONS_BATCH_SIZE:500}
    cron: "${NOTIFICATIONS_CELEBRATIONS_CRON:0 0 14 * * *}"

rate-limit:
  per-ip:
    window-seconds: ${RL_IP_WINDOW_SECONDS:60}
    max-requests: ${RL_IP_MAX_REQUESTS:120}
  per-user:
    window-seconds: ${RL_USER_WINDOW_SECONDS:60}
    max-requests: ${RL_USER_MAX_REQUESTS:180}

verification:
  echo-code: ${VERIFICATION_ECHO_CODE:false}
  code-ttl-seconds: ${VERIFICATION_CODE_TTL_SECONDS:600}
  default-community-ttl-days: ${VERIFICATION_DEFAULT_COMMUNITY_TTL_DAYS:365}

specializations:
  default-join-cooldown-months: ${SPECIALIZATIONS_DEFAULT_JOIN_COOLDOWN_MONTHS:6}
  photo-id:
    max-image-bytes: ${VERIFICATION_PHOTO_ID_MAX_IMAGE_BYTES:10485760} # 10MB
    session-ttl: ${VERIFICATION_PHOTO_ID_SESSION_TTL:PT30M}
    presign-ttl: ${VERIFICATION_PHOTO_ID_PRESIGN_TTL:PT15M}
    admin-download-ttl: ${VERIFICATION_PHOTO_ID_ADMIN_DOWNLOAD_TTL:PT5M}
    rejected-delete-after-days: ${VERIFICATION_PHOTO_ID_REJECTED_DELETE_AFTER_DAYS:7}
    cleanup-cron: "${VERIFICATION_PHOTO_ID_CLEANUP_CRON:0 */5 * * * *}"

email:
  enabled: ${EMAIL_ENABLED:true}
  from: ${EMAIL_FROM:}
  reply-to: ${EMAIL_REPLY_TO:}
  verify-base-url: ${EMAIL_VERIFY_BASE_URL:}
  configuration-set: ${EMAIL_CONFIGURATION_SET:}

onboarding:
  default-company-domain: ${ONBOARDING_DEFAULT_COMPANY_DOMAIN:looped.global}

retention:
  deactivated-days: ${RETENTION_DEACTIVATED_DAYS:90}
  username-tombstone-days: ${RETENTION_USERNAME_TOMBSTONE_DAYS:14}

anon:
  issuer:
    kid: ${ANON_ISSUER_KID:dev-issuer}
    maxAge: ${ANON_CERT_MAX_AGE:365d}
    kek: ${ANON_ISSUER_KEK:}
    keyBits: ${ANON_ISSUER_KEY_BITS:2048}
