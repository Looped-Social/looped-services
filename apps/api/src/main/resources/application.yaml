spring:
  application:
    name: looped-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/looped}
    username: ${DB_USERNAME:looped}
    password: ${DB_PASSWORD:looped}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  data:
    redis:
      url: ${redis.url}

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
  pattern:
    console: ''

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

s3:
  bucket: ${S3_BUCKET:looped-dev-media}
  region: ${AWS_REGION:us-east-1}
  verification:
    bucket: ${S3_VERIFICATION_BUCKET:}
    region: ${S3_VERIFICATION_REGION:${AWS_REGION:us-east-1}}
  messaging:
    bucket: ${S3_MESSAGING_BUCKET:${S3_DM_BUCKET:}}
    region: ${S3_MESSAGING_REGION:${S3_DM_REGION:${AWS_REGION:us-east-1}}}

cloudfront:
  domain: ${CLOUDFRONT_DOMAIN:}

logoDev:
  token: ${LOGO_DEV_TOKEN:}
  retina: ${LOGO_DEV_RETINA:true}
  size: ${LOGO_DEV_SIZE:256}

media:
  # Prefer the human-readable *_SIZE env vars (e.g., "20MB", "256MB"); *_BYTES are supported for backward compatibility.
  maxImageSize: ${MEDIA_MAX_IMAGE_SIZE:${MEDIA_MAX_IMAGE_BYTES:10MB}}
  maxVideoSize: ${MEDIA_MAX_VIDEO_SIZE:${MEDIA_MAX_VIDEO_BYTES:100MB}}
  callbackSecret: ${MEDIA_CALLBACK_SECRET:}
  sanitizeImagesOnCallback: ${MEDIA_SANITIZE_IMAGES_ON_CALLBACK:true}
  maxImageDimension: ${MEDIA_MAX_IMAGE_DIMENSION:8192}
  maxImagePixels: ${MEDIA_MAX_IMAGE_PIXELS:40000000}
  normalizedMaxImageDimension: ${MEDIA_NORMALIZED_MAX_IMAGE_DIMENSION:2048}
  normalizedJpegQuality: ${MEDIA_NORMALIZED_JPEG_QUALITY:0.82}

auth:
  # Firebase Auth defaults; override via env in each environment
  issuer: ${AUTH_ISSUER:https://securetoken.google.com/YOUR_FIREBASE_PROJECT_ID}
  audience: ${AUTH_AUDIENCE:YOUR_FIREBASE_PROJECT_ID}
  jwksUri: ${AUTH_JWKS_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}

firebase:
  admin:
    credentialsJson: ${FIREBASE_ADMIN_CREDENTIALS_JSON:}
    credentialsPath: ${FIREBASE_ADMIN_CREDENTIALS_PATH:}
    required: ${FIREBASE_ADMIN_REQUIRED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Idempotency-Key,X-Actor,X-Media-Signature}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

admin:
  edge-secret: ${ADMIN_EDGE_SECRET:}
  ops-alerts:
    enabled: ${ADMIN_OPS_ALERTS_ENABLED:false}
    environment: ${APP_ENV:}
    required-environment: ${ADMIN_OPS_ALERTS_REQUIRED_ENV:prod}
    time-zone: ${ADMIN_OPS_ALERTS_TIME_ZONE:America/New_York}
    daily-cron: "${ADMIN_OPS_ALERTS_DAILY_CRON:0 0 17 * * *}"
    hourly-cron: "${ADMIN_OPS_ALERTS_HOURLY_CRON:0 0 * * * *}"
    verification-pending-threshold: ${ADMIN_OPS_ALERTS_VERIFICATION_PENDING_THRESHOLD:100}
    reports-open-threshold: ${ADMIN_OPS_ALERTS_REPORTS_OPEN_THRESHOLD:50}
    moderation-queue-open-threshold: ${ADMIN_OPS_ALERTS_MODERATION_QUEUE_OPEN_THRESHOLD:75}
    spike-fraction-threshold: ${ADMIN_OPS_ALERTS_SPIKE_FRACTION_THRESHOLD:0.30}
    spike-absolute-threshold: ${ADMIN_OPS_ALERTS_SPIKE_ABSOLUTE_THRESHOLD:10}
    hourly-cooldown: ${ADMIN_OPS_ALERTS_HOURLY_COOLDOWN:PT2H}
    admin-base-url: ${ADMIN_OPS_ALERTS_ADMIN_BASE_URL:}
  fyp-alerts:
    enabled: ${ADMIN_FYP_ALERTS_ENABLED:false}
    environment: ${APP_ENV:}
    required-environment: ${ADMIN_FYP_ALERTS_REQUIRED_ENV:prod}
    time-zone: ${ADMIN_FYP_ALERTS_TIME_ZONE:America/New_York}
    cron: "${ADMIN_FYP_ALERTS_CRON:0 30 * * * *}"
    cooldown: ${ADMIN_FYP_ALERTS_COOLDOWN:PT24H}
    perf-window-minutes: ${ADMIN_FYP_ALERTS_PERF_WINDOW_MINUTES:60}
    perf-min-sampled-requests: ${ADMIN_FYP_ALERTS_PERF_MIN_SAMPLED_REQUESTS:200}
    global-fyp-estimated-rps-threshold: ${ADMIN_FYP_ALERTS_GLOBAL_FYP_ESTIMATED_RPS_THRESHOLD:50}
    global-fyp-p95-upper-bound-ms-threshold: ${ADMIN_FYP_ALERTS_GLOBAL_FYP_P95_UPPER_BOUND_MS_THRESHOLD:750}
    global-fyp-sampled-5xx-rate-threshold: ${ADMIN_FYP_ALERTS_GLOBAL_FYP_SAMPLED_5XX_RATE_THRESHOLD:0.005}
    telemetry-events-24h-threshold: ${ADMIN_FYP_ALERTS_TELEMETRY_EVENTS_24H_THRESHOLD:5000000}
    feed-impressions-24h-threshold: ${ADMIN_FYP_ALERTS_FEED_IMPRESSIONS_24H_THRESHOLD:2500000}
    telemetry-table-bytes-threshold: ${ADMIN_FYP_ALERTS_TELEMETRY_TABLE_BYTES_THRESHOLD:10737418240} # 10GB
    posts-created-24h-threshold: ${ADMIN_FYP_ALERTS_POSTS_CREATED_24H_THRESHOLD:50000}
    min-interactable-impression-share: ${ADMIN_FYP_ALERTS_MIN_INTERACTABLE_IMPRESSION_SHARE:0.50}
    runbook-url: ${ADMIN_FYP_ALERTS_RUNBOOK_URL:}
    dashboard-url: ${ADMIN_FYP_ALERTS_DASHBOARD_URL:}

redis:
  url: ${REDIS_URL:redis://localhost:6379}

sqs:
  notifQueueUrl: ${SQS_NOTIF_QUEUE_URL:}
  region: ${AWS_REGION:us-east-1}

notifications:
  celebrations:
    enabled: ${NOTIFICATIONS_CELEBRATIONS_ENABLED:true}
    birthday-enabled: ${NOTIFICATIONS_BIRTHDAY_ENABLED:true}
    anniversary-enabled: ${NOTIFICATIONS_ANNIVERSARY_ENABLED:true}
    batch-size: ${NOTIFICATIONS_CELEBRATIONS_BATCH_SIZE:500}
    cron: "${NOTIFICATIONS_CELEBRATIONS_CRON:0 0 14 * * *}"

rate-limit:
  per-ip:
    window-seconds: ${RL_IP_WINDOW_SECONDS:60}
    max-requests: ${RL_IP_MAX_REQUESTS:120}
  per-user:
    window-seconds: ${RL_USER_WINDOW_SECONDS:60}
    max-requests: ${RL_USER_MAX_REQUESTS:180}

communities:
  verification-expiry-cron: "${COMMUNITIES_VERIFICATION_EXPIRY_CRON:0 0 * * * *}"
  verification-reminders:
    enabled: ${COMMUNITIES_VERIFICATION_REMINDERS_ENABLED:true}
    cron: "${COMMUNITIES_VERIFICATION_REMINDERS_CRON:0 10 * * * *}"
    batch-size: ${COMMUNITIES_VERIFICATION_REMINDERS_BATCH_SIZE:500}
    expired-lookback-days: ${COMMUNITIES_VERIFICATION_REMINDERS_EXPIRED_LOOKBACK_DAYS:14}

community:
  logos:
    allowExternalCustomUrl: ${COMMUNITY_LOGOS_ALLOW_EXTERNAL_CUSTOM_URL:false}

verification:
  echo-code: ${VERIFICATION_ECHO_CODE:false}
  code-ttl-seconds: ${VERIFICATION_CODE_TTL_SECONDS:600}
  email-code-max-attempts: ${VERIFICATION_EMAIL_CODE_MAX_ATTEMPTS:5}
  email-resend-cooldown-seconds: ${VERIFICATION_EMAIL_RESEND_COOLDOWN_SECONDS:60}
  email-max-starts-per-hour: ${VERIFICATION_EMAIL_MAX_STARTS_PER_HOUR:10}
  email-max-starts-per-day: ${VERIFICATION_EMAIL_MAX_STARTS_PER_DAY:25}
  default-community-ttl-days: ${VERIFICATION_DEFAULT_COMMUNITY_TTL_DAYS:365}

specializations:
  default-join-cooldown-months: ${SPECIALIZATIONS_DEFAULT_JOIN_COOLDOWN_MONTHS:6}
  photo-id:
    max-image-bytes: ${VERIFICATION_PHOTO_ID_MAX_IMAGE_BYTES:10485760} # 10MB
    session-ttl: ${VERIFICATION_PHOTO_ID_SESSION_TTL:PT30M}
    presign-ttl: ${VERIFICATION_PHOTO_ID_PRESIGN_TTL:PT15M}
    admin-download-ttl: ${VERIFICATION_PHOTO_ID_ADMIN_DOWNLOAD_TTL:PT5M}
    rejected-delete-after-days: ${VERIFICATION_PHOTO_ID_REJECTED_DELETE_AFTER_DAYS:7}
    cleanup-cron: "${VERIFICATION_PHOTO_ID_CLEANUP_CRON:0 */5 * * * *}"

email:
  enabled: ${EMAIL_ENABLED:true}
  from: ${EMAIL_FROM:}
  admin-from: ${EMAIL_ADMIN_FROM:}
  community-request-from: ${EMAIL_COMMUNITY_REQUEST_FROM:no-reply@mylooped.app}
  reply-to: ${EMAIL_REPLY_TO:}
  verify-base-url: ${EMAIL_VERIFY_BASE_URL:}
  configuration-set: ${EMAIL_CONFIGURATION_SET:}

onboarding:
  default-company-domain: ${ONBOARDING_DEFAULT_COMPANY_DOMAIN:looped.global}

app-config:
  minimum-supported-version: ${APP_MINIMUM_SUPPORTED_VERSION:}
  minimum-supported-version-message: ${APP_MINIMUM_SUPPORTED_VERSION_MESSAGE:}
  minimum-supported-version-update-url: ${APP_MINIMUM_SUPPORTED_VERSION_UPDATE_URL:}

share:
  base-url: ${SHARE_BASE_URL:https://mylooped.app}

universal-links:
  apple-team-id: ${UL_APPLE_TEAM_ID:REPLACE_TEAM_ID}
  ios-bundle-id: ${UL_IOS_BUNDLE_ID:REPLACE_BUNDLE_ID}
  cache-max-age-seconds: ${UL_CACHE_MAX_AGE_SECONDS:300}
  aasa-version: ${UL_AASA_VERSION:v1}
  ios-paths:
    - /p/*
    - /u/*
    - /app/*
    - /login*
    - /
  android-package-name: ${UL_ANDROID_PACKAGE_NAME:}
  android-sha256-cert-fingerprint: ${UL_ANDROID_SHA256_CERT_FINGERPRINT:}

retention:
  deactivated-days: ${RETENTION_DEACTIVATED_DAYS:90}
  username-tombstone-days: ${RETENTION_USERNAME_TOMBSTONE_DAYS:14}

anon:
  issuer:
    kid: ${ANON_ISSUER_KID:dev-issuer}
    maxAge: ${ANON_CERT_MAX_AGE:365d}
    issueTokenTtl: ${ANON_ISSUE_TOKEN_TTL:10m}
    kek: ${ANON_ISSUER_KEK:}
    keyBits: ${ANON_ISSUER_KEY_BITS:2048}

feed:
  fyp:
    eligible-window-days: ${FEED_FYP_ELIGIBLE_WINDOW_DAYS:90}
    discovery-window-days: ${FEED_FYP_DISCOVERY_WINDOW_DAYS:7}
    eligible-half-life-hours: ${FEED_FYP_ELIGIBLE_HALF_LIFE_HOURS:48}
    discovery-half-life-hours: ${FEED_FYP_DISCOVERY_HALF_LIFE_HOURS:12}
    eligible-baseline-engagement: ${FEED_FYP_ELIGIBLE_BASELINE_ENGAGEMENT:0.25}
    discovery-baseline-engagement: ${FEED_FYP_DISCOVERY_BASELINE_ENGAGEMENT:0.10}
    pattern-eligible: ${FEED_FYP_PATTERN_ELIGIBLE:3}
    pattern-discovery: ${FEED_FYP_PATTERN_DISCOVERY:1}
    min-eligible-fraction: ${FEED_FYP_MIN_ELIGIBLE_FRACTION:0.50}
    candidates-multiplier: ${FEED_FYP_CANDIDATES_MULTIPLIER:10}
    max-candidates-per-pool: ${FEED_FYP_MAX_CANDIDATES_PER_POOL:250}
    max-per-author: ${FEED_FYP_MAX_PER_AUTHOR:2}
    max-per-community: ${FEED_FYP_MAX_PER_COMMUNITY:5}
  metrics:
    global-fyp:
      enabled: ${FEED_METRICS_GLOBAL_FYP_ENABLED:true}
      sample-rate: ${FEED_METRICS_GLOBAL_FYP_SAMPLE_RATE:0.01}
      retention: ${FEED_METRICS_GLOBAL_FYP_RETENTION:PT72H}

telemetry:
  retention:
    enabled: ${TELEMETRY_RETENTION_ENABLED:true}
    days: ${TELEMETRY_RETENTION_DAYS:30}
    batch-size: ${TELEMETRY_RETENTION_BATCH_SIZE:5000}
    max-batches-per-run: ${TELEMETRY_RETENTION_MAX_BATCHES_PER_RUN:20}
    cron: "${TELEMETRY_RETENTION_CRON:0 0 4 * * *}"

widgets:
  snapshot-ttl-seconds: ${WIDGET_SNAPSHOT_TTL_SECONDS:900}
