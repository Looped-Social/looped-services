name: Deploy API to Staging (ECS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPO: ${{ vars.ECR_REPO }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER_STAGING }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE_STAGING }}

jobs:
  test:
    name: Build and Test (API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run tests (apps/api)
        run: ./mvnw -q -T 1C -pl apps/api -am test

  deploy:
    name: Build Image and Deploy
    runs-on: ubuntu-latest
    needs: [ test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:main
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      - name: Wait for service stability
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 1800)) # 30 minutes
          echo "Waiting for ECS service stability (timeout: 30m)..."

          while (( SECONDS < deadline )); do
            status_json="$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${AWS_REGION}" \
              --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,primary:deployments[?status==`PRIMARY`]|[0],events:events[0:5]}' \
              --output json)"

            desired="$(echo "${status_json}" | jq -r '.desired')"
            running="$(echo "${status_json}" | jq -r '.running')"
            pending="$(echo "${status_json}" | jq -r '.pending')"
            rollout_state="$(echo "${status_json}" | jq -r '.primary.rolloutState // ""')"

            echo "desired=${desired} running=${running} pending=${pending} rollout=${rollout_state}"

            if [[ "${desired}" == "${running}" && "${pending}" == "0" && "${rollout_state}" == "COMPLETED" ]]; then
              echo "Service stable."
              exit 0
            fi

            sleep 15
          done

          echo "ERROR: ECS service did not become stable within 30 minutes."
          echo "${status_json}" | jq .
          exit 1
