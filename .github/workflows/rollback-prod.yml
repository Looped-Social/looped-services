name: Rollback API Production (ECS)

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "ECR tag to roll back from"
        required: false
        default: "prod-prev"
        type: string
      reason:
        description: "Reason for rollback (for run notes)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPO: ${{ vars.ECR_REPO }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER_PROD }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE_PROD }}
  API_BASE_URL: ${{ vars.API_BASE_URL_PROD }}

jobs:
  rollback:
    name: Roll back prod API from selected tag
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate rollback variables
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?missing AWS_REGION (GitHub Actions var)}"
          : "${ECR_REPO:?missing ECR_REPO (GitHub Actions var)}"
          : "${ECS_CLUSTER:?missing ECS_CLUSTER_PROD (GitHub Actions var)}"
          : "${ECS_SERVICE:?missing ECS_SERVICE_PROD (GitHub Actions var)}"

          SOURCE_TAG="${{ github.event.inputs.source_tag }}"
          if [[ -z "${SOURCE_TAG}" ]]; then
            echo "source_tag cannot be empty"
            exit 1
          fi

          if [[ -n "${{ github.event.inputs.reason }}" ]]; then
            echo "Rollback reason: ${{ github.event.inputs.reason }}"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Capture current prod image manifest (for rollback safety)
        id: current
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$(aws ecr batch-get-image \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPO}" \
            --image-ids "imageTag=prod" \
            --query 'images[0].imageManifest' \
            --output text)"

          if [[ -z "${MANIFEST}" || "${MANIFEST}" == "None" ]]; then
            echo "curr_manifest_b64=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          curr_manifest_b64="$(printf '%s' "${MANIFEST}" | base64 -w0 2>/dev/null || printf '%s' "${MANIFEST}" | base64 | tr -d '\n')"
          echo "curr_manifest_b64=${curr_manifest_b64}" >> "${GITHUB_OUTPUT}"

      - name: Promote rollback source tag to prod
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_TAG="${{ github.event.inputs.source_tag }}"
          [[ -z "${SOURCE_TAG}" ]] && SOURCE_TAG="prod-prev"

          echo "Rolling back ${ECR_REPO}:prod <= ${ECR_REPO}:${SOURCE_TAG}"

          MANIFEST="$(aws ecr batch-get-image \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPO}" \
            --image-ids "imageTag=${SOURCE_TAG}" \
            --query 'images[0].imageManifest' \
            --output text)"

          if [[ -z "${MANIFEST}" || "${MANIFEST}" == "None" ]]; then
            echo "ERROR: Could not find rollback source tag '${SOURCE_TAG}' in '${ECR_REPO}'."
            echo "Try running deploy-prod once with the new workflow (it saves :prod-prev)."
            exit 1
          fi

          aws ecr put-image \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPO}" \
            --image-tag prod \
            --image-manifest "${MANIFEST}" >/dev/null

      - name: Force new ECS deployment (prod rollback)
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      - name: Wait for service stability (prod rollback)
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 1800)) # 30 minutes
          echo "Waiting for ECS service stability (timeout: 30m)..."

          while (( SECONDS < deadline )); do
            status_json="$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${AWS_REGION}" \
              --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,primary:deployments[?status==`PRIMARY`]|[0],events:events[0:5]}' \
              --output json)"

            desired="$(echo "${status_json}" | jq -r '.desired')"
            running="$(echo "${status_json}" | jq -r '.running')"
            pending="$(echo "${status_json}" | jq -r '.pending')"
            rollout_state="$(echo "${status_json}" | jq -r '.primary.rolloutState // ""')"

            echo "desired=${desired} running=${running} pending=${pending} rollout=${rollout_state}"

            if [[ "${desired}" == "${running}" && "${pending}" == "0" && "${rollout_state}" == "COMPLETED" ]]; then
              echo "Service stable."
              exit 0
            fi

            sleep 15
          done

          echo "ERROR: ECS service did not become stable within 30 minutes."
          echo "${status_json}" | jq .
          exit 1

      - name: Smoke check (prod)
        if: env.API_BASE_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          url="${API_BASE_URL%/}/actuator/health"
          echo "Smoke checking ${url} ..."

          for i in {1..30}; do
            body="$(curl -fsS --max-time 5 "${url}" || true)"
            status="$(echo "${body}" | jq -r '.status // empty' 2>/dev/null || true)"
            if [[ "${status}" == "UP" ]]; then
              echo "OK"
              exit 0
            fi
            sleep 5
          done

          echo "ERROR: health check did not return UP"
          exit 1

      - name: Restore pre-rollback prod image (if rollback fails)
        if: failure() && steps.current.outputs.curr_manifest_b64 != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "Rollback deployment failed; restoring previous :prod manifest."
          curr_manifest="$(printf '%s' "${{ steps.current.outputs.curr_manifest_b64 }}" | base64 -d)"

          aws ecr put-image \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPO}" \
            --image-tag prod \
            --image-manifest "${curr_manifest}" >/dev/null

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${AWS_REGION}"
