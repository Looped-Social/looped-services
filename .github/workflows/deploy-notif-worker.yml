name: Deploy Notif Worker to Staging (ECS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPO: ${{ vars.ECR_REPO_NOTIF_WORKER }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER_STAGING }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE_NOTIF_WORKER_STAGING }}

jobs:
  build:
    name: Build (notif-worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workers/notif-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  deploy:
    name: Build, Push, Deploy (staging)
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workers/notif-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:main
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      - name: Wait for service stability
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800)) # 30 minutes
          while true; do
            out="$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" --region "${AWS_REGION}")"
            desired="$(echo "$out" | jq -r '.services[0].desiredCount')"
            running="$(echo "$out" | jq -r '.services[0].runningCount')"
            pending="$(echo "$out" | jq -r '.services[0].pendingCount')"
            echo "desired=$desired running=$running pending=$pending"
            if [[ "$pending" == "0" && "$running" == "$desired" ]]; then
              echo "service stable"
              break
            fi
            if [[ "$SECONDS" -gt "$deadline" ]]; then
              echo "timed out waiting for stability"
              exit 1
            fi
            sleep 15
          done
